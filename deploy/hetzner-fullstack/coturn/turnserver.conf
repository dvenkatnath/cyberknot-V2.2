# TURN relay for CyberKnot. ${TURN_SECRET} and ${DOMAIN} are filled in at start.
listening-port=3478
fingerprint
use-auth-secret
static-auth-secret=${TURN_SECRET}
realm=${DOMAIN}
server-name=${DOMAIN}
total-quota=200
user-quota=20
stale-nonce=600
no-cli
no-tls
no-dtls
no-multicast-peers
no-loopback-peers
log-file=stdout
simple-log

# Relay ports (matches the Hetzner firewall rule UDP 49160-49200)
min-port=49160
max-port=49200

# Never let the relay reach private or internal addresses
# (includes the Hetzner metadata service at 169.254.169.254).
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
